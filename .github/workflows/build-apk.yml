name: Build APK

# Собирает debug-APK в облаке: Android SDK локально не нужен.
# Скопируйте этот файл в .github/workflows/build-apk.yml вашего репозитория
# (папка android должна лежать в корне репозитория).

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore release keystore (if secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
            echo "KEYSTORE_FILE=$HOME/release.keystore" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 not set - release APK will fall back to debug key"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          gradle -p android assembleDebug
          gradle -p android assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
