plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.voodo.offlinetranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.voodo.offlinetranslator'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("KEYSTORE_ALIAS")
            if (ksFile != null && ksPass != null && ksAlias != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE") != null && file(System.getenv("KEYSTORE_FILE")).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // ML Kit on-device translation: модели скачиваются один раз, дальше офлайн
    implementation 'com.google.mlkit:translate:17.0.3'
    // Автоопределение языка (тоже on-device)
    implementation 'com.google.mlkit:language-id:17.0.6'
    // Vosk: офлайн-распознавание речи (голос -> текст на устройстве)
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
