name: Build APK

# Собирает debug-APK в облаке: Android SDK локально не нужен.
# Скопируйте этот файл в .github/workflows/build-apk.yml вашего репозитория
# (папка android должна лежать в корне репозитория).

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
